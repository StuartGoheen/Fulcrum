<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The First Supper — Conversation Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #c8c8d0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(180deg, #14141f 0%, #0a0a0f 100%);
      border-bottom: 1px solid #2a2a3a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      color: #d4a574;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .header .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .comfort-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comfort-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .comfort-pips {
      display: flex;
      gap: 4px;
    }

    .comfort-pip {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #3a3a4a;
      transition: all 0.5s ease;
    }

    .comfort-pip.active {
      background: #d4a574;
      border-color: #d4a574;
      box-shadow: 0 0 6px rgba(212, 165, 116, 0.4);
    }

    .comfort-pip.warning {
      background: #a05a2c;
      border-color: #a05a2c;
    }

    .comfort-pip.danger {
      background: #8b2020;
      border-color: #8b2020;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .conversation-log {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-panel {
      width: 380px;
      background: #10101a;
      border-left: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a3a;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .questions-explored {
      color: #d4a574;
      font-size: 11px;
    }

    .question-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .question-group-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 12px 8px 4px;
    }

    .question-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin: 2px 0;
      background: #1a1a2a;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #c8c8d0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .question-btn:hover {
      background: #222238;
      border-color: #d4a574;
      color: #fff;
    }

    .question-btn.story { border-left: 3px solid #4a7a4a; }
    .question-btn.business { border-left: 3px solid #4a6a8a; }
    .question-btn.probe { border-left: 3px solid #8a4a4a; }

    .question-btn.explored {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
      border-left-color: #333;
    }

    .question-btn.locked {
      opacity: 0.2;
      cursor: default;
      pointer-events: none;
      border-left-color: #333;
    }

    .question-btn.locked::after {
      content: ' [locked]';
      color: #8b2020;
      font-size: 11px;
    }

    .question-btn .type-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      display: block;
    }

    .question-btn.story .type-tag { color: #4a7a4a; }
    .question-btn.business .type-tag { color: #4a6a8a; }
    .question-btn.probe .type-tag { color: #8a4a4a; }

    .ask-maya-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin: 2px 0;
      background: #141820;
      border: 1px solid #2a3a4a;
      border-left: 3px solid #6a9ab8;
      border-radius: 6px;
      color: #8ab8d0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-style: italic;
    }

    .ask-maya-btn:hover {
      background: #1a2838;
      border-color: #6a9ab8;
      color: #b0d8f0;
    }

    .ask-maya-btn.explored {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .tell-me-about {
      padding: 8px;
      border-top: 1px solid #2a2a3a;
    }

    .tell-me-about-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      background: #1a1a28;
      border: 1px dashed #3a3a4a;
      border-radius: 6px;
      color: #d4a574;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tell-me-about-btn:hover {
      background: #222238;
      border-color: #d4a574;
    }

    .log-entry {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-entry.read-aloud {
      background: linear-gradient(135deg, #12121e 0%, #18182a 100%);
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 20px 24px;
      font-style: italic;
      color: #a8a8b8;
      line-height: 1.7;
      white-space: pre-line;
    }

    .log-entry.question {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
    }

    .question-speaker {
      background: #2a3a5a;
      color: #8ab4f8;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
      margin-top: 2px;
    }

    .question-text {
      font-size: 15px;
      color: #8ab4f8;
      font-weight: 500;
    }

    .log-entry.response {
      background: linear-gradient(135deg, #161620 0%, #1a1a28 100%);
      border: 1px solid #2a2a3a;
      border-left: 3px solid #d4a574;
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      line-height: 1.7;
      white-space: pre-line;
      color: #d0d0d8;
    }

    .log-entry.response .speaker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4a574;
      margin-bottom: 8px;
    }

    .log-entry.gm-note {
      background: #1a1420;
      border: 1px solid #3a2a4a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #a88ac0;
      line-height: 1.5;
    }

    .log-entry.gm-note .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a6aaa;
      margin-bottom: 4px;
    }

    .log-entry.maya {
      background: linear-gradient(135deg, #141820 0%, #1a2028 100%);
      border: 1px solid #2a3a4a;
      border-left: 3px solid #6a9ab8;
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      font-style: italic;
      color: #8ab8d0;
      line-height: 1.6;
    }

    .log-entry.maya .speaker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6a9ab8;
      margin-bottom: 6px;
      font-style: normal;
    }

    .log-entry.system {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 8px;
      border-top: 1px solid #1a1a2a;
      border-bottom: 1px solid #1a1a2a;
    }

    .log-entry.comfort-change {
      text-align: center;
      padding: 6px;
      font-size: 11px;
      color: #a05a2c;
      letter-spacing: 1px;
    }

    .log-entry.ending {
      background: linear-gradient(135deg, #12121e 0%, #18182a 100%);
      border: 1px solid #d4a574;
      border-radius: 8px;
      padding: 20px 24px;
      font-style: italic;
      color: #d4a574;
      line-height: 1.7;
      white-space: pre-line;
      text-align: center;
    }

    .show-gm-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .show-gm-toggle input { display: none; }

    .show-gm-toggle .toggle-track {
      width: 32px;
      height: 16px;
      background: #2a2a3a;
      border-radius: 8px;
      position: relative;
      transition: background 0.2s;
    }

    .show-gm-toggle input:checked + .toggle-track {
      background: #8a6aaa;
    }

    .show-gm-toggle .toggle-thumb {
      width: 12px;
      height: 12px;
      background: #666;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: all 0.2s;
    }

    .show-gm-toggle input:checked + .toggle-track .toggle-thumb {
      left: 18px;
      background: #c8a0e0;
    }

    .show-gm-toggle .label-text {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gm-notes-hidden .gm-note { display: none; }

    .reset-btn {
      padding: 6px 12px;
      background: #2a2a3a;
      border: 1px solid #3a3a4a;
      border-radius: 4px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #3a3a4a;
      color: #c8c8d0;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .followup-divider {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 8px 8px 2px;
      border-top: 1px solid #1a1a2a;
      margin-top: 4px;
    }

    .conversation-log::-webkit-scrollbar,
    .question-list::-webkit-scrollbar {
      width: 6px;
    }

    .conversation-log::-webkit-scrollbar-track,
    .question-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .conversation-log::-webkit-scrollbar-thumb,
    .question-list::-webkit-scrollbar-thumb {
      background: #2a2a3a;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>THE FIRST SUPPER</h1>
      <div class="subtitle">Interlude — Aboard the Banshee, Night One</div>
    </div>
    <div class="controls-row">
      <label class="show-gm-toggle">
        <input type="checkbox" id="gmToggle" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="label-text">GM Notes</span>
      </label>
      <div class="comfort-display">
        <span class="comfort-label">Comfort</span>
        <div class="comfort-pips" id="comfortPips"></div>
      </div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="conversation-log" id="log"></div>
    <div class="question-panel">
      <div class="panel-header">
        <span>Available Questions</span>
        <span class="questions-explored" id="exploredCount">0 explored</span>
      </div>
      <div class="question-list" id="questionList"></div>
      <div class="tell-me-about" id="tellMeAbout" style="display:none;">
        <button class="tell-me-about-btn" id="tellMeAboutBtn">"Tell me about..."</button>
      </div>
    </div>
  </div>

  <script>
    let data = null;
    let state = {
      comfort: 5,
      explored: new Set(),
      unlocked: new Set(),
      questionsAsked: 0,
      mayaTriggered: new Set(),
      ended: false,
      viewingFollowUps: null
    };

    async function init() {
      const res = await fetch('/data/conversations/varth-debrief.json');
      data = await res.json();
      resetState();
      renderComfort();
      addReadAloud(data.readAloud);
      addGmNote(data.gmNotes);
      renderQuestions();
    }

    function resetState() {
      state = {
        comfort: data.comfort.starting,
        explored: new Set(),
        unlocked: new Set(),
        questionsAsked: 0,
        mayaTriggered: new Set(),
        ended: false,
        viewingFollowUps: null
      };
      document.getElementById('log').innerHTML = '';
      updateExploredCount();
    }

    function renderComfort() {
      const container = document.getElementById('comfortPips');
      container.innerHTML = '';
      for (let i = 1; i <= data.comfort.max; i++) {
        const pip = document.createElement('div');
        pip.className = 'comfort-pip';
        if (i <= state.comfort) {
          pip.classList.add('active');
          if (state.comfort <= 2) pip.classList.add('warning');
          if (state.comfort <= 1) pip.classList.add('danger');
        }
        container.appendChild(pip);
      }
    }

    function addReadAloud(text) {
      const el = document.createElement('div');
      el.className = 'log-entry read-aloud';
      el.textContent = text;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addQuestion(text) {
      const el = document.createElement('div');
      el.className = 'log-entry question';
      el.innerHTML = `<span class="question-speaker">Crew</span><span class="question-text">"${text}"</span>`;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addResponse(text) {
      const el = document.createElement('div');
      el.className = 'log-entry response';
      el.innerHTML = `<div class="speaker">Admiral Varth</div>${text}`;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addGmNote(text) {
      const el = document.createElement('div');
      el.className = 'log-entry gm-note';
      el.innerHTML = `<div class="label">GM Note</div>${text}`;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addMaya(text) {
      const el = document.createElement('div');
      el.className = 'log-entry maya';
      el.innerHTML = `<div class="speaker">Maya</div>${text}`;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addSystem(text) {
      const el = document.createElement('div');
      el.className = 'log-entry system';
      el.textContent = text;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addComfortChange(from, to) {
      const el = document.createElement('div');
      el.className = 'log-entry comfort-change';
      const arrow = to < from ? '\u2193' : '\u2191';
      el.textContent = `Comfort ${from} ${arrow} ${to}`;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function addEnding(text) {
      const el = document.createElement('div');
      el.className = 'log-entry ending';
      el.textContent = text;
      document.getElementById('log').appendChild(el);
      scrollLog();
    }

    function scrollLog() {
      const log = document.getElementById('log');
      setTimeout(() => log.scrollTop = log.scrollHeight, 50);
    }

    function findQuestion(id) {
      const root = data.roots.find(r => r.id === id);
      if (root) return root;
      return data.followUps[id] || null;
    }

    function askQuestion(id) {
      if (state.ended || state.explored.has(id)) return;

      const q = findQuestion(id);
      if (!q) return;

      if (q.minComfort && state.comfort < q.minComfort) return;

      state.explored.add(id);
      state.questionsAsked++;

      addQuestion(q.text);

      if (q.comfortCost && q.comfortCost < 0) {
        const oldComfort = state.comfort;
        state.comfort = Math.max(0, state.comfort + q.comfortCost);
        addComfortChange(oldComfort, state.comfort);
        renderComfort();
      }

      setTimeout(() => {
        addResponse(q.response);

        if (q.gmNote) {
          addGmNote(q.gmNote);
        }

        if (q.unlocks) {
          q.unlocks.forEach(uid => state.unlocked.add(uid));
        }

        checkMayaInterjections();
        checkEndConditions();

        state.viewingFollowUps = (q.unlocks && q.unlocks.length > 0) ? id : null;
        renderQuestions();
        updateExploredCount();
      }, 300);
    }

    function checkMayaInterjections() {
      if (!data.mayaInterjections) return;

      data.mayaInterjections.forEach((mi, idx) => {
        if (state.mayaTriggered.has(idx)) return;

        let shouldTrigger = false;

        if (mi.trigger.includes('After any 3 questions') && state.questionsAsked === 3) {
          shouldTrigger = true;
        }
        if (mi.trigger.includes('empire-transition') && state.explored.has('empire-transition')) {
          shouldTrigger = true;
        }
        if (mi.trigger.includes('comfort drops to 2') && state.comfort === 2) {
          shouldTrigger = true;
        }

        if (shouldTrigger) {
          state.mayaTriggered.add(idx);
          setTimeout(() => {
            addMaya(mi.text);
            if (mi.gmNote) addGmNote(mi.gmNote);
          }, 600);
        }
      });
    }

    function checkEndConditions() {
      if (state.comfort <= data.comfort.exitThreshold) {
        state.ended = true;
        setTimeout(() => {
          addEnding(data.comfort.exitLine);
          renderQuestions();
        }, 800);
        return;
      }

      const allRootsExplored = data.roots.every(r => state.explored.has(r.id));
      const accessibleUnlocked = [...state.unlocked].filter(uid => {
        const q = data.followUps[uid];
        if (!q) return false;
        if (q.minComfort && state.comfort < q.minComfort) return false;
        return true;
      });
      const allAccessibleExplored = accessibleUnlocked.every(uid => state.explored.has(uid));
      if (allRootsExplored && allAccessibleExplored) {
        state.ended = true;
        setTimeout(() => {
          addEnding(data.comfort.dryLine);
          renderQuestions();
        }, 800);
      }
    }

    function getAvailableFollowUps(parentId) {
      const parent = findQuestion(parentId);
      if (!parent || !parent.unlocks) return [];
      return parent.unlocks
        .map(uid => data.followUps[uid])
        .filter(q => q && !state.explored.has(q.id));
    }

    function getAvailableRoots() {
      return data.roots.filter(r => !state.explored.has(r.id));
    }

    function isLocked(q) {
      if (q.minComfort && state.comfort < q.minComfort) return true;
      return false;
    }

    function renderQuestions() {
      const container = document.getElementById('questionList');
      container.innerHTML = '';

      if (state.ended) {
        const msg = document.createElement('div');
        msg.className = 'question-group-label';
        msg.textContent = 'Conversation ended';
        msg.style.textAlign = 'center';
        msg.style.padding = '40px 8px';
        msg.style.color = '#555';
        container.appendChild(msg);
        document.getElementById('tellMeAbout').style.display = 'none';
        return;
      }

      if (state.viewingFollowUps) {
        const followUps = getAvailableFollowUps(state.viewingFollowUps);

        if (followUps.length > 0) {
          const label = document.createElement('div');
          label.className = 'followup-divider';
          label.textContent = 'Follow-up Questions';
          container.appendChild(label);

          followUps.forEach(q => {
            const btn = createQuestionBtn(q);
            container.appendChild(btn);
          });
        }

        document.getElementById('tellMeAbout').style.display = 'block';
      } else {
        renderRootQuestions(container);
        document.getElementById('tellMeAbout').style.display = 'none';
      }

      const allUnlocked = [...state.unlocked]
        .map(uid => data.followUps[uid])
        .filter(q => q && !state.explored.has(q.id) && state.viewingFollowUps !== q.parentId);

      if (allUnlocked.length > 0 && !state.viewingFollowUps) {
        const label = document.createElement('div');
        label.className = 'followup-divider';
        label.textContent = 'Unlocked Follow-ups';
        container.appendChild(label);

        allUnlocked.forEach(q => {
          const btn = createQuestionBtn(q);
          container.appendChild(btn);
        });
      }

      if (state.questionsAsked >= 1 && !state.explored.has('ask-maya')) {
        const mayaLabel = document.createElement('div');
        mayaLabel.className = 'followup-divider';
        mayaLabel.textContent = '';
        container.appendChild(mayaLabel);

        const mayaBtn = document.createElement('button');
        mayaBtn.className = 'ask-maya-btn';
        mayaBtn.textContent = '"Maya, what do you think of him?"';
        mayaBtn.addEventListener('click', () => {
          state.explored.add('ask-maya');
          addQuestion('Maya, what do you think of him?');
          setTimeout(() => {
            const mi = data.mayaInterjections.find(m => m.trigger.includes('asks Maya what she thinks'));
            if (mi) {
              addMaya(mi.text);
              if (mi.gmNote) addGmNote(mi.gmNote);
            }
            renderQuestions();
            updateExploredCount();
          }, 300);
        });
        container.appendChild(mayaBtn);
      }
    }

    function renderRootQuestions(container) {
      const label = document.createElement('div');
      label.className = 'question-group-label';
      label.textContent = 'Topics';
      container.appendChild(label);

      data.roots.forEach(q => {
        const btn = createQuestionBtn(q);
        container.appendChild(btn);
      });
    }

    function createQuestionBtn(q) {
      const btn = document.createElement('button');
      btn.className = `question-btn ${q.type}`;

      if (state.explored.has(q.id)) {
        btn.classList.add('explored');
      } else if (isLocked(q)) {
        btn.classList.add('locked');
      }

      btn.innerHTML = `${q.text}<span class="type-tag">${q.type}${q.comfortCost < 0 ? ' \u2022 costs comfort' : ''}</span>`;

      if (!state.explored.has(q.id) && !isLocked(q)) {
        btn.addEventListener('click', () => askQuestion(q.id));
      }

      return btn;
    }

    function updateExploredCount() {
      const total = data.roots.length + Object.keys(data.followUps).length;
      document.getElementById('exploredCount').textContent = `${state.explored.size}/${total} explored`;
    }

    document.getElementById('gmToggle').addEventListener('change', function() {
      document.body.classList.toggle('gm-notes-hidden', !this.checked);
    });

    document.getElementById('tellMeAboutBtn').addEventListener('click', () => {
      state.viewingFollowUps = null;
      renderQuestions();
      addSystem('"Tell me about..."');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      resetState();
      renderComfort();
