<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hutt's Hangar — Docking Bay 4414 — Tactical Map</title>
<link rel="stylesheet" href="/css/map-standalone.css" />
</head>
<body class="map-hutts-hangar">

<div class="tooltip" id="tooltip"></div>

<div class="map-container">
  <img src="hutts-hangar.png" alt="Hutt's Hangar — Docking Bay 4414">

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 895" preserveAspectRatio="xMidYMid meet" data-grid-on="1" data-grid-size="80" data-grid-offx="0" data-grid-offy="0" data-grid-opacity="35" data-grid-color="white" data-grid-linewidth="1">

    <rect x="40" y="10" width="940" height="70" rx="3" class="hitbox"
      data-room="Glorious Chariot — Launch Cradle"
      data-desc="The north end of the hangar opens onto the adjacent launch cradle, framed by heavy durasteel scaffolding. Three of the Glorious Chariot's main thrusters are visible through the scaffolding gaps — gold and purple housings, turbine cowlings already cycling for launch. Between the two tallest scaffold towers, the yacht's boarding ramp is still down, retractable stairs extended onto a platform that abuts the hangar's north wall. The scaffolding itself is climbable with an Athletics check. The ramp is the only way to physically reach Varga before the Chariot lifts. Once the engines reach full cycle, heat wash will make the scaffolding impassable and audibility in the whole north half of the hangar will drop to zero. The Hutt's voice already booms from the cradle's public-address speakers."/>

    <rect x="40" y="220" width="240" height="500" rx="3" class="hitbox"
      data-room="Port Fighter Line"
      data-desc="Two Z-95 Headhunters parked nose-out along the west wall — Varga's mercenary fleet. Worn paint, mismatched panels, one with a replacement S-foil clearly salvaged from a different airframe. Wingtips and engine housings provide heavy cover for anyone crouched behind them. Fuel hoses snake across the deck, unsafe under sustained fire. Between the two fighters, a cleared lane gives a sightline to the hangar floor. Ladders are down on both cockpits — the pilots were ready to scramble."/>

    <rect x="760" y="100" width="260" height="720" rx="3" class="hitbox"
      data-room="Starboard Fighter Line"
      data-desc="Four Z-95 Headhunters parked along the east wall in tight formation, nose-out toward the floor. Varga's primary flight line. Wingtips overlap slightly — moving between them is tight quarters and breaks line-of-sight from the main floor. The rearmost Z-95 is clearly Varga's personal craft — crimson detailing, custom cowling, a Huttese glyph painted on the fuselage. Fuel and power umbilicals run from under each fighter to bulkhead sockets on the east wall. Any running pilot heads for one of these four cockpits."/>

    <rect x="290" y="80" width="470" height="400" rx="3" class="hitbox"
      data-room="Hangar Floor — Open"
      data-desc="The central deck — scratched and scored durasteel plating with painted lane markings worn nearly invisible. No cover. Anyone crossing the open floor is exposed from the port line, the starboard line, and the rear wall simultaneously. The scoring on the deck tells the story of a hundred rough landings and hasty departures. Overhead lighting is harsh work-lamps clamped to the rear framework — shadows are short and hard-edged. Running the open floor is the fastest way to a Z-95, and the most dangerous."/>

    <rect x="240" y="500" width="260" height="220" rx="3" class="hitbox"
      data-room="Cargo Crates"
      data-desc="Three clusters of stacked cargo crates in the center-south area — dark durasteel containers marked with Trandoshan manifests and Guild tibanna-gas hazard placards. Two-crate stacks and a three-crate stack arranged with gaps between them — functional cover, with cross-firing lanes for anyone who knows the geometry. The crates are heavy enough to stop blaster fire and light enough to be shoved with effort. Some are hot to the touch — recently offloaded. This is the primary cover cluster on the hangar floor and the natural first objective for an assaulting force."/>

    <rect x="290" y="730" width="470" height="110" rx="3" class="hitbox"
      data-room="South Approach"
      data-desc="The south end of the floor, between the cargo cluster and the main entrance. Two small equipment lockers sit against the south wall — toolboxes, fire-suppression gear, a wall-mounted emergency blast shield. The lighting is dimmer here — the work-lamps overhead are angled toward the fighter lines, not the floor. Anyone crouching low behind the lockers has partial cover against fire from the rear wall, but is fully exposed from either fighter line."/>

    <rect x="300" y="850" width="420" height="40" rx="3" class="hitbox"
      data-room="Hangar Entrance"
      data-desc="The main access door — wide enough for two repulsor-sleds abreast, currently open. Beyond it, a short corridor leads out into the Cloud City docking concourse. This is where the heroes enter. Two small tool bins and a clipboard on a hook suggest a docking clerk's station, abandoned. An emergency lockdown panel is set into the left wall — a tech check can seal the door behind the crew to buy time, OR seal them IN with whatever is in the hangar."/>

  </svg>
</div>

</body>
</html>
